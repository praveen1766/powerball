name: Scrape NJ Lottery Data

on:
  schedule:
    # ① Morning run: 5:00 AM ET = 09:00 UTC (captures overnight Evening draw)
    - cron: '0 9 * * *'
    # ② Night run:  11:00 PM ET = 03:00 UTC (captures Midday + Evening of the day)
    - cron: '0 3 * * *'
  workflow_dispatch: # ← Manual trigger — go to Actions tab and click "Run workflow"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Pull the latest commit so we don't overwrite data from a previous run
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cloudscraper beautifulsoup4

    - name: Pull latest data before scraping
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git pull --rebase origin main || true

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and push if data changed
      run: |
        git add nj_data.json
        if git diff --staged --quiet; then
          echo "✅ No new data — nothing to commit."
        else
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "🎰 Update NJ Lottery Data — ${TIMESTAMP} [skip ci]"
          git push origin main
          echo "✅ Data updated and pushed."
        fi
